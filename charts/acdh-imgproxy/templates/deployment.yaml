{{- $persistent := .Values.cache.storage.persistent }}
apiVersion: apps/v1
{{- /* A Deployment cannot give each replica its own volume, so a persistent cache runs as a StatefulSet. */}}
kind: {{ ternary "StatefulSet" "Deployment" $persistent }}
metadata:
  name: {{ include "acdh-imgproxy.cacheName" . }}
  labels:
    {{- include "acdh-imgproxy.labels" . | nindent 4 }}
    app.kubernetes.io/name: imgproxy-cache
    app.kubernetes.io/component: cache
spec:
  replicas: {{ .Values.cache.replicas }}
  {{- if $persistent }}
  serviceName: {{ include "acdh-imgproxy.cacheName" . }}
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "acdh-imgproxy.cacheSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acdh-imgproxy.cacheSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.cache.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "acdh-imgproxy.cacheSelectorLabels" . | nindent 14 }}
      containers:
        - name: nginx
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.cache.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "acdh-imgproxy.cacheName" . }}-config
        {{- if not $persistent }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.storage.cacheSizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.cache.storage.tmpSizeLimit }}
  {{- if $persistent }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          {{- include "acdh-imgproxy.cacheSelectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.cache.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.storage.cacheSizeLimit }}
  {{- end }}
