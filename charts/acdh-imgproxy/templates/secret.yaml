{{- if and .Values.cache.refresh.token (not .Values.cache.refresh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "acdh-imgproxy.refreshSecretName" . }}
  labels:
    {{- include "acdh-imgproxy.labels" . | nindent 4 }}
    app.kubernetes.io/name: imgproxy-cache
    app.kubernetes.io/component: cache
type: Opaque
data:
  {{ .Values.cache.refresh.secretKey }}: {{ .Values.cache.refresh.token | b64enc | quote }}
{{- end }}
